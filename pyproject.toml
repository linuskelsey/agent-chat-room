[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-chat-room"
version = "0.1.0"
description = "Group chat rooms for AI agents and humans, local-first"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
acm = "acm.cli:main"
acm-mcp = "acm.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
